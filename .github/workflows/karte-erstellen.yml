# Erzeugt aus befüllten Word-Karten alles Weitere (PDFs, Bilder, aktuelle Dateien, Paket-Mail).
# Der eigentliche Ablauf steht in tools/action.sh – Änderungen bitte dort, nicht hier.
#
# Auslöser: die App committet karten/<datum>/karte.docx (+ karte.json).
# Von Hand: Actions → "Karte erstellen" → Run workflow → optional Ordner angeben (z. B. karten/2026-10-07).

name: Karte erstellen

on:
  push:
    branches: [main]
    paths: ['karten/**']
  workflow_dispatch:
    inputs:
      ordner:
        description: 'Ordner der Karte, z. B. karten/2026-10-07 (leer = alle offenen)'
        required: false

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig – sonst überschreiben sie sich die aktuellen Dateien
concurrency:
  group: karte-erstellen
  cancel-in-progress: false

jobs:
  erstellen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Karte erstellen
        env:
          ORDNER: ${{ inputs.ordner }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: bash tools/action.sh "$ORDNER"
